{% extends 'approvals/base.html' %}
{% block content %}
<div style="text-align: center; padding: 4rem 0;">
    <h1 style="font-size: 3rem; margin-bottom: 1rem; background: -webkit-linear-gradient(#3b82f6, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Welcome to the Letter Approval Section</h1>

    <div style="display: flex; justify-content: center; gap: 2rem; margin-top: 4rem;">
        <div class="card" style="width: 300px;">
            <h3>Faculty Portal</h3>
            <p style="color: #94a3b8; margin-bottom: 1.5rem;">Access the faculty dashboard to review and approve  requests.</p>
            <a href="{% url 'faculty_login' %}" class="btn btn-accent" style="display: block; text-decoration: none;">Faculty Login Here</a>
        </div>
        <div class="card" style="width: 300px;">
            <h3>Student Portal</h3>
            <p style="color: #94a3b8; margin-bottom: 1.5rem;">Submit and track your requests across the hierarchy.</p>
            <a href="{% url 'student_login' %}" class="btn" style="display: block; text-decoration: none;">Student Login Here</a>
        </div>
    </div>
</div>
{% endblock %}
